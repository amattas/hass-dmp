[project]
site_name = "DMP for Home Assistant"
site_description = "DMP alarm panel integration for Home Assistant."
site_author = "hass-dmp contributors"
site_url = "https://amattas.github.io/hass-dmp/"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/amattas/hass-dmp"
repo_name = "amattas/hass-dmp"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 hass-dmp contributors"

nav = [
  { "Home" = "index.md" },
  { "Guide" = [
    { "Installation" = "guide/installation.md" },
    { "Panel configuration" = "guide/panel-configuration.md" },
    { "Features" = "guide/features.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
logo = "material/shield-home"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.extra.version]
provider = "mike"
default = "latest"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
