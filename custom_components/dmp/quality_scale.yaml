# Home Assistant integration quality scale
# https://contributors.home-assistant.io/core/quality-scale/
# Status: done | todo | exempt (exempt carries a comment with the reason).
# Tier claimed in manifest.json: silver. The five Gold rules left as todo all
# depend on panel discovery / zone enumeration (issue #52) and are handled
# together in that follow-up; once they are done the manifest moves to platinum.

rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no service actions.
  appropriate-polling:
    status: exempt
    comment: Local push integration; the panel sends events over its Serial 3 protocol. No polling loop.
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration registers no service actions.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: todo
    comment: Needs SSDP support in pydmp first; tracked in issue #52.
  discovery-update-info:
    status: todo
    comment: Follows discovery; tracked in issue #52.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: todo
    comment: Zones and areas are user-configured today; enumeration from the panel is tracked in issue #52.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: todo
    comment: Repairs for zones missing from or unknown to the panel need enumeration; tracked in issue #52.
  stale-devices:
    status: todo
    comment: Removing zones the panel no longer reports needs enumeration; tracked in issue #52.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: pydmp speaks the panel's raw TCP protocol; there is no HTTP session to inject.
  strict-typing: done
