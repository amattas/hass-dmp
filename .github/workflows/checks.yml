# Checks — automatic on push to main and nightly (hassfest tracks the Home
# Assistant dev branch); on pull requests the run waits at the `approve` job until
# a reviewer approves it in the `approval` environment. The Release workflow
# requires a successful run of this workflow on main HEAD.
#
# Required checks (default-branch ruleset): "python / checks (3.14)",
# "python / security", "hacs / hassfest" and "hacs / hacs".
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  approve:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    environment: approval
    steps:
      - run: echo "Checks approved by ${GITHUB_TRIGGERING_ACTOR}"

  python:
    needs: approve
    if: always() && needs.approve.result != 'failure' && needs.approve.result != 'cancelled'
    uses: mattas-net/.github/.github/workflows/python-ci.yml@main
    permissions:
      contents: read
    with:
      python-versions: '["3.14"]' # Home Assistant's Python (homeassistant 2026.10 requires >=3.14.2)
      build: false # HACS installs custom_components/ from the release; there is no package to build
      audit: "off" # Home Assistant pins the dependency tree; PR dependency review still runs

  hacs:
    needs: approve
    if: always() && needs.approve.result != 'failure' && needs.approve.result != 'cancelled'
    uses: mattas-net/.github/.github/workflows/hacs-ci.yml@main
    permissions:
      contents: read
