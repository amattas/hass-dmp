# Checks — automatic on push to main and nightly (hassfest tracks the Home
# Assistant dev branch); on pull requests the run waits at the `approve` job until
# a reviewer approves it in the `approval` environment. The Release workflow
# requires a successful run of this workflow on main HEAD.
#
# Required checks (default-branch ruleset): "checks" and "security". See mattas-net/.github STANDARD.md.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  approve:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: approval
    steps:
      - run: echo "Checks approved by ${GITHUB_TRIGGERING_ACTOR}"

  python:
    needs: approve
    if: always() && needs.approve.result != 'failure' && needs.approve.result != 'cancelled'
    uses: mattas-net/.github/.github/workflows/python-ci.yml@main
    permissions:
      contents: read
    with:
      python-versions: '["3.14"]' # Home Assistant's Python (homeassistant 2026.10 requires >=3.14.2)
      build: false # HACS installs custom_components/ from the release; there is no package to build
      audit: "off" # Home Assistant pins the dependency tree; PR dependency review still runs

  hacs:
    needs: approve
    if: always() && needs.approve.result != 'failure' && needs.approve.result != 'cancelled'
    uses: mattas-net/.github/.github/workflows/hacs-ci.yml@main
    permissions:
      contents: read

  # Aliases: rulesets require exactly "checks" and "security" (STANDARD.md). The `if: always()`
  # matters: a skipped required check counts as passing, so always run and assert.
  checks:
    needs: [python, hacs]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the shared checks jobs
        env:
          PYTHON_RESULT: ${{ needs.python.outputs.checks-result }}
          HACS_RESULT: ${{ needs.hacs.outputs.checks-result }}
        run: test "$PYTHON_RESULT" = success && test "$HACS_RESULT" = success

  security:
    needs: [python, hacs]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the shared security jobs
        env:
          PYTHON_RESULT: ${{ needs.python.outputs.security-result }}
          HACS_RESULT: ${{ needs.hacs.outputs.security-result }}
        run: test "$PYTHON_RESULT" = success && test "$HACS_RESULT" = success
