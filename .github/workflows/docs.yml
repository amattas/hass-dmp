name: Docs

# Docs: build every documented version with Zensical and publish the versioned site (mike) to the
# gh-pages branch with the shared mattas-net/.github docs.yml (scripts/publish_versioned_docs.py):
#   dev = main, X.Y = newest patch tag of each documented minor line, latest = highest stable release.
# Public repos serve gh-pages with Pages; private repos build gh-pages and keep Pages disabled.
# Triggers: push to main, manual dispatch, and workflow_call (release.yml calls it after tagging).
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version that triggered the publish (informational)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  docs:
    uses: mattas-net/.github/.github/workflows/docs.yml@main
    permissions:
      contents: write # the publish script pushes the gh-pages branch
    with:
      version: ${{ inputs.version }}
