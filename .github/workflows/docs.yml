# Docs — build every documented release with Zensical and publish the
# versioned site (mike) to the gh-pages branch.
# One-time: repo Settings → Pages → Source: Deploy from a branch → gh-pages.
name: Docs

on:
  push:
    branches: [main]
    tags:
      - '*.*.*'
      - 'v*.*.*'
    paths:
      - 'docs/**'
      - 'scripts/docs_versioning.py'
      - 'scripts/publish_versioned_docs.py'
      - 'zensical.toml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: docs-gh-pages
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install documentation tools
        run: |
          python -m pip install --disable-pip-version-check -r requirements-docs.txt
      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish
        run: python scripts/publish_versioned_docs.py --push
