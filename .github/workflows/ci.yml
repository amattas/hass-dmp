# CI — every PR and push to the default branch. (Starter kit: amattas/aviato/starter)
# Keep the job id `ci` — the branch ruleset requires a check context named "ci".
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  approve:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    environment: approval
    steps:
      - run: echo "Checks approved by ${GITHUB_TRIGGERING_ACTOR}"

  ci:
    needs: approve
    # Runs when approve passed or was skipped (push/dispatch); a rejected approval stops it.
    if: always() && needs.approve.result != 'failure' && needs.approve.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -r requirements.test.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
