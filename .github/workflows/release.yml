# Release: bump "version" in custom_components/dmp/manifest.json, merge to main,
# then Actions -> Release -> enter that version (bare semver, e.g. 1.0.1).
# Tags main, creates the GitHub release (HACS installs from releases), then publishes docs.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (bare semver, e.g. 1.4.2)
        required: true
        type: string

jobs:
  release:
    uses: amattas/.github/.github/workflows/create-release.yml@main
    permissions:
      contents: write
      actions: read
    with:
      version: ${{ inputs.version }}
      manifest: custom_components/dmp/manifest.json
      require-workflow: CI
  docs:
    needs: release
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: write
