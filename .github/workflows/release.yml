# Release: bump "version" in custom_components/dmp/manifest.json, merge to main,
# then Actions -> Release -> enter that version (bare semver, e.g. 1.4.2).
# Tags main, creates the GitHub release (HACS installs from releases), then publishes docs.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (bare semver, e.g. 1.4.2)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    uses: mattas-net/.github/.github/workflows/create-release.yml@main
    permissions:
      contents: write
      actions: read
    with:
      version: ${{ inputs.version }}
      manifest: custom_components/dmp/manifest.json
      require-workflow: Checks

  docs:
    needs: release
    permissions:
      contents: write # docs.yml: the publish script pushes the gh-pages branch
    uses: ./.github/workflows/docs.yml
    with:
      version: ${{ inputs.version }}
